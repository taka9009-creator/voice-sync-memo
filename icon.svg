<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景グラデーション (漆黒マホガニー) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1613" />
      <stop offset="40%" stop-color="#14100d" />
      <stop offset="100%" stop-color="#080605" />
    </linearGradient>

    <!-- ゴールドメタリック グラデーション -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3cd" />
      <stop offset="25%" stop-color="#eac775" />
      <stop offset="50%" stop-color="#cf9b44" />
      <stop offset="75%" stop-color="#f5e1a4" />
      <stop offset="100%" stop-color="#9a6c23" />
    </linearGradient>

    <!-- 真鍮・アンティークブロンズ グラデーション -->
    <linearGradient id="bronzeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#694b28" />
      <stop offset="50%" stop-color="#9e743e" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>

    <!-- 羊皮紙ページ グラデーション -->
    <linearGradient id="pageGradLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8cbb5" />
      <stop offset="50%" stop-color="#ede3d1" />
      <stop offset="100%" stop-color="#fbf7ef" />
    </linearGradient>

    <linearGradient id="pageGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8cbb5" />
      <stop offset="50%" stop-color="#ede3d1" />
      <stop offset="100%" stop-color="#fbf7ef" />
    </linearGradient>

    <!-- 琥珀の光彩グロー -->
    <radialGradient id="ambientGlow" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#eac775" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#cf9b44" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- 封蝋レッド グラデーション -->
    <linearGradient id="waxRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d62828" />
      <stop offset="100%" stop-color="#780000" />
    </linearGradient>

    <!-- ドロップシャドウ -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.75" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- アイコンベース (角丸スクエア) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#382c23" stroke-width="3" />

  <!-- 背景アンビエントライト -->
  <circle cx="256" cy="245" r="210" fill="url(#ambientGlow)" />

  <!-- 金箔の飾り外枠フレーム (インナーボーダー) -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-opacity="0.4" />
  <rect x="44" y="44" width="424" height="424" rx="84" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="4 6" stroke-opacity="0.25" />

  <!-- 四隅のアンティークコーナー装飾 -->
  <g stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 64 88 A 24 24 0 0 1 88 64" />
    <circle cx="88" cy="88" r="3" fill="url(#goldGrad)" />
    <path d="M 448 88 A 24 24 0 0 0 424 64" />
    <circle cx="424" cy="88" r="3" fill="url(#goldGrad)" />
    <path d="M 64 424 A 24 24 0 0 0 88 448" />
    <circle cx="88" cy="424" r="3" fill="url(#goldGrad)" />
    <path d="M 448 424 A 24 24 0 0 1 424 448" />
    <circle cx="424" cy="424" r="3" fill="url(#goldGrad)" />
  </g>

  <!-- 音波リング (オーディオ周波数ウェーブ) -->
  <g opacity="0.75" filter="url(#softGlow)">
    <!-- 外側リング -->
    <circle cx="256" cy="220" r="150" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3 14" opacity="0.3" />
    <!-- 中間リング -->
    <circle cx="256" cy="220" r="125" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-dasharray="8 8" opacity="0.45" />
    <!-- 音波の縦バー (波形イコライザーの弧) -->
    <g stroke="url(#goldGrad)" stroke-linecap="round" stroke-width="3">
      <!-- 左翼の波形 -->
      <line x1="120" y1="220" x2="120" y2="220" />
      <line x1="135" y1="210" x2="135" y2="230" stroke-width="2.5" opacity="0.5" />
      <line x1="150" y1="195" x2="150" y2="245" stroke-width="3" opacity="0.7" />
      <line x1="165" y1="180" x2="165" y2="260" stroke-width="3.5" opacity="0.85" />
      <line x1="180" y1="170" x2="180" y2="270" stroke-width="4" />
      <!-- 右翼の波形 -->
      <line x1="332" y1="170" x2="332" y2="270" stroke-width="4" />
      <line x1="347" y1="180" x2="347" y2="260" stroke-width="3.5" opacity="0.85" />
      <line x1="362" y1="195" x2="362" y2="245" stroke-width="3" opacity="0.7" />
      <line x1="377" y1="210" x2="377" y2="230" stroke-width="2.5" opacity="0.5" />
      <line x1="392" y1="220" x2="392" y2="220" />
    </g>
  </g>

  <!-- 開かれたアンティーク古書 (メインオブジェクト) -->
  <g filter="url(#shadow)">
    <!-- 本の革装丁・背表紙ベース (ダークレザー) -->
    <path d="M 104 340 C 160 355 230 360 256 375 C 282 360 352 355 408 340 L 416 348 C 360 365 285 370 256 385 C 227 370 152 365 96 348 Z" 
          fill="#4a2e1b" stroke="url(#goldGrad)" stroke-width="1.5" />

    <!-- ページ群 (下層の厚み) -->
    <path d="M 106 332 C 160 346 226 350 256 366 C 286 350 352 346 406 332 L 408 340 C 352 355 282 360 256 375 C 230 360 160 355 104 340 Z" 
          fill="#c5b69f" opacity="0.9" />

    <!-- 左ページ (羊皮紙) -->
    <path d="M 256 362 C 225 344 165 338 112 324 C 110 270 114 230 118 200 C 168 214 225 220 256 242 Z" 
          fill="url(#pageGradLeft)" stroke="#9c8c76" stroke-width="0.8" />

    <!-- 左ページの活字罫線 (言の葉のテクスチャ) -->
    <g stroke="#9c8c76" stroke-width="1.5" stroke-linecap="round" opacity="0.35">
      <line x1="140" y1="230" x2="230" y2="252" />
      <line x1="138" y1="248" x2="232" y2="270" />
      <line x1="136" y1="266" x2="234" y2="288" />
      <line x1="134" y1="284" x2="230" y2="306" />
      <line x1="132" y1="302" x2="200" y2="318" />
    </g>

    <!-- 右ページ (羊皮紙) -->
    <path d="M 256 242 C 287 220 344 214 394 200 C 398 230 402 270 400 324 C 347 338 287 344 256 362 Z" 
          fill="url(#pageGradRight)" stroke="#9c8c76" stroke-width="0.8" />

    <!-- 右ページの活字罫線 -->
    <g stroke="#9c8c76" stroke-width="1.5" stroke-linecap="round" opacity="0.35">
      <line x1="282" y1="252" x2="372" y2="230" />
      <line x1="280" y1="270" x2="374" y2="248" />
      <line x1="278" y1="288" x2="376" y2="266" />
      <line x1="282" y1="306" x2="378" y2="284" />
      <line x1="284" y1="324" x2="352" y2="308" />
    </g>

    <!-- 栞（しおり）リボン (深紅の封蝋レッド) -->
    <path d="M 253 245 C 253 280 250 375 248 405 L 258 395 L 268 405 C 266 375 260 280 259 245 Z" 
          fill="url(#waxRed)" filter="url(#shadow)" />
  </g>

  <!-- 中央のシンボル: クラシック・マイクロフォン × 万年筆ペン先 -->
  <g filter="url(#shadow)">
    <!-- マイク本体（蓄音・万年筆の上部） -->
    <!-- カプセル上部ドーム -->
    <path d="M 230 145 C 230 115 282 115 282 145 L 282 185 C 282 205 230 205 230 185 Z" 
          fill="url(#goldGrad)" stroke="#664614" stroke-width="2" />

    <!-- マイクグリル網目テクスチャ -->
    <g stroke="#7a5518" stroke-width="1.5" opacity="0.6">
      <line x1="230" y1="135" x2="282" y2="135" />
      <line x1="230" y1="150" x2="282" y2="150" />
      <line x1="230" y1="165" x2="282" y2="165" />
      <line x1="230" y1="180" x2="282" y2="180" />
      <line x1="243" y1="122" x2="243" y2="195" />
      <line x1="256" y1="120" x2="256" y2="197" stroke-width="2" />
      <line x1="269" y1="122" x2="269" y2="195" />
    </g>

    <!-- 万年筆のペン先（Nib）への融合部 -->
    <path d="M 224 195 L 256 250 L 288 195 C 275 198 237 198 224 195 Z" 
          fill="url(#goldGrad)" stroke="#593b0f" stroke-width="1.5" />

    <!-- ペン先のスリットとインク穴 -->
    <line x1="256" y1="202" x2="256" y2="245" stroke="#2a1a06" stroke-width="2" />
    <circle cx="256" cy="216" r="3.5" fill="#2a1a06" />

    <!-- マイクの金属アーム（サスペンション） -->
    <path d="M 216 165 C 216 215 296 215 296 165" 
          fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
    <line x1="256" y1="210" x2="256" y2="235" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- 煌めく言の葉の光粒子 (Sparkles) -->
  <g fill="url(#goldGrad)" opacity="0.85" filter="url(#softGlow)">
    <!-- 上空の光 -->
    <circle cx="256" cy="92" r="3.5" />
    <path d="M 256 80 L 259 89 L 268 92 L 259 95 L 256 104 L 253 95 L 244 92 L 253 89 Z" />

    <!-- 左右の星の煌めき -->
    <path d="M 185 130 L 187 136 L 193 138 L 187 140 L 185 146 L 183 140 L 177 138 L 183 136 Z" transform="scale(0.8) translate(40, 20)" />
    <path d="M 327 130 L 329 136 L 335 138 L 329 140 L 327 146 L 325 140 L 319 138 L 325 136 Z" transform="scale(0.8) translate(70, 20)" />

    <circle cx="160" cy="155" r="2" opacity="0.6" />
    <circle cx="352" cy="155" r="2" opacity="0.6" />
    <circle cx="205" cy="115" r="1.5" opacity="0.5" />
    <circle cx="307" cy="115" r="1.5" opacity="0.5" />
  </g>
</svg>
